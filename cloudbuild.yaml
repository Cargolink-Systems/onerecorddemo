# Test, build and release the demo through the shared step of cargolink-release
# (_RELEASE_IMAGE, pinned by version). The new revision gets NO traffic until the
# checks of release/onerecorddemo.json pass on its own URL; then all the traffic,
# the same checks on the service URL, the build ends (--no-watch), and the trigger
# watch-onerecorddemo watches the request log for 5 minutes (the step default) and rolls back by
# itself on a fault that repeats. Rollback by hand (~50 s):
#   gcloud builds triggers run rollback-onerecorddemo --project air-connect-479417 --region us-east1 --branch main
#
# The release passes no service flags but --allow-unauthenticated, so it inherits
# the rest of the live Cloud Run config (scaling, probes). In particular, the
# service's startup probe was switched by hand from the Cloud Run default (TCP,
# which only checks the port is open) to an HTTP probe on / — Next's generated
# standalone server.js starts accepting TCP connections before its request
# handler is assigned, so under a TCP probe Cloud Run can route real traffic into
# that gap and the first request(s) to a fresh instance 500 with "handler is not
# a function". An HTTP probe only reports ready once / actually responds:
#   gcloud run services update onerecorddemo --region=us-east1 \
#     --startup-probe=httpGet.path=/,httpGet.port=8080,timeoutSeconds=1,periodSeconds=2,failureThreshold=15

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-east1
  _SERVICE: onerecorddemo
  _REPO: cloud-run-source-deploy
  # The release step. An upgrade is this one line.
  _RELEASE_IMAGE: 'us-east1-docker.pkg.dev/air-connect-479417/cargolink/cargolink-release:1.26.0'

steps:
  - id: test
    name: node:22
    entrypoint: bash
    args: ['-c', 'npm ci && npm test']

  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_DEMO_MODE=1
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - .

  # The release file, at once.
  - id: release-file
    name: ${_RELEASE_IMAGE}
    waitFor: ['-']
    args: ['validate', '--config=release/onerecorddemo.json']

  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: ['test', 'build', 'release-file']
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID

  # --build=$BUILD_ID: an older build gives way to a newer one.
  - id: release
    name: ${_RELEASE_IMAGE}
    waitFor: ['push']
    args:
      - run
      - --config=release/onerecorddemo.json
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --build=$BUILD_ID
      - --no-watch
      - --
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
